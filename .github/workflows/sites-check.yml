name: sites-check

# Weekly smoke/SEO check of every site linked from the hub, plus EXTRA_SITES (status, title
# length, description, canonical, og:image, hreflang alternates, robots.txt Sitemap line,
# sitemap and a sample of its URLs), old-host 301s and geo.lipu.dev. Also runs when the hub changes.
on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths: ["docs/**", "scripts/check_sites.py", ".github/workflows/sites-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_sites.py
