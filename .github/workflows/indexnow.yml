name: indexnow

# Daily: submit new/changed sitemap URLs of the hub sites to IndexNow (Bing, Yandex, ...).
# The previous run's sitemap snapshot lives in the Actions cache; see scripts/indexnow.py.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v4
        with:
          path: indexnow-state.json
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-
      - run: python3 scripts/indexnow.py
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: indexnow-state.json
          key: indexnow-${{ github.run_id }}
